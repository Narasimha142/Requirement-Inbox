<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requirement Inbox</title>
<link rel="icon" href="icons/icon48.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap" id="app">
    <header class="top">
      <div>
        <h1>Requirement Inbox</h1>
        <p>Job requirements from recruiter emails, Dice, job boards and startups, matched to your profile, answered in bulk and tracked.</p>
      </div>
      <div class="row-flex" id="hdr-right"></div>
    </header>
    <div id="banner"></div>
    <div id="main"><div class="panel empty">Loading…</div></div>
  </div>
  <div id="replybar-root"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <script src="lib/pdf.min.js"></script>
  <script src="lib/mammoth.browser.min.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
